name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ratemyclass
          POSTGRES_PASSWORD: ratemyclass
          POSTGRES_DB: ratemyclass
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ratemyclass" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ratemyclass:ratemyclass@localhost:5433/ratemyclass
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests scripts
      - run: uv run alembic upgrade head
      - run: uv run alembic check  # models and migrations agree
      - run: uv run pytest

  scraper:
    # Tests use saved HTML fixtures only; CI never contacts counts.oxy.edu. The load tests need
    # the catalog tables, so this job has its own Postgres like the backend job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ratemyclass
          POSTGRES_PASSWORD: ratemyclass
          POSTGRES_DB: ratemyclass
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ratemyclass" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ratemyclass:ratemyclass@localhost:5433/ratemyclass
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy oxy_scraper tests
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-types:
    # Fails if the backend API changed but `make gen-api` was not run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --all-packages
      - run: cd frontend && npm ci
      - run: make gen-api
      - run: git diff --exit-code frontend/src/lib/api/schema.d.ts
